<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop of Beauty</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/clear-list.css">

</head>

<body class="page">

  <main class="page__content">
    <section class="product">
      <h1 class="product__title">Выбери свой продукт</h1>
      <ul class="product__list"></ul>
        <template id="product-card-template">
          <li class="product-card">
          <img class="product-card__img" src="" alt="" width="290" height="290" />
          <p class="product-card__type"></p>
          <h2 class="product-card__name"></h2>
          <p class="product-card__desc"></p>
          <div class="product-card__compound compound">
            <h3 class="compound__title">Состав:</h3>
            <ul class="compound__list">
            </ul>
          </div>
          <div class="product-card__price">
            <span class="product-card__price-label">Цена:</span>
            <span class="product-card__price-value"></span>
          </div>
          </li>
        </template>
    </section>
  </main>

  <script type="module" src="homework-10.js"></script>

</body>

</html>
