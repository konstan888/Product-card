<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop of Beauty</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/clear-list.css">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/reset.css">
</head>

<body>

  <header class="header">
    <button class="header__registration-btn" type="button">Регистрация</button>
  </header>
  <main></main>
  <footer class="site-footer">
    <div class="site-footer__top">
      <div class="site-footer__brand">
        <h3 class="site-footer__brand-name">Product Cards</h3>
        <p class="site-footer__brand-slogan">У Нас Самые Лучшие Продукты Для Кожи!
        </p>
        <nav class="site-footer__socials" aria-label="Социальные сети">
          <a href="#" aria-label="Telegram">
            <img src="img/tg.png" alt="" width="21" height="17.61">
          </a>
          <a href="#" aria-label="ВКонтакте">
            <img src="img/vk.png" alt="" width="24" height="14">
          </a>
        </nav>
      </div>

      <div class="site-footer__subscribe">
        <h3 class="site-footer__subscribe-title">Подпишись на наши акции:</h3>
        <form class="site-footer__subscribe-form" method="post" id="email-form">
          <label class="visually-hidden" for="subscribe-email">Ваш Email</label>
          <div class="site-footer__subscribe-field">
            <input class="site-footer__input" name="subscribe_email" id="subscribe-email" type="email" required
              placeholder="Введи Email...">
            <button class="site-footer__button" type="submit">Подписаться</button>
          </div>
        </form>
      </div>
      <nav class="site-footer__navigation" aria-label="Быстрые ссылки">
        <h3 class="site-footer__navigation-title">Быстрые ссылки</h3>
        <ul class="site-footer__navigation-list">
          <li> <a href="#">Главная</a> </li>
          <li> <a href="#">Магазин</a> </li>
          <li> <a href="#">Контакты</a> </li>
        </ul>
      </nav>
    </div>
    <div class="site-footer__bottom">
      <p class="site-footer__copyright"><a href="#"> www.product-cards.com©all right reserve</a></p>
    </div>
  </footer>
  <div class="overlay"></div>
  <div class="modal">
    <button class="modal__close-btn" type="button" aria-label="Закрыть">&times;</button>
    <form class="modal__form" id="reg-form" method="post" action="#">
      <label class="visually-hidden" for="name">Имя</label>
      <input class="modal__input" type="text" required name="name" id="name" placeholder="Введите имя">
      <label class="visually-hidden" for="surname">Фамилия</label>
      <input class="modal__input" type="text" required name="surname" id="surname" placeholder="Введите фамилию">
      <label class="visually-hidden" for="birth-date">Дата рождения</label>
      <input class="modal__input" type="date" required name="birth_date" id="birth-date"
        placeholder="Введите дату рождения">
      <label class="visually-hidden" for="login">Логин</label>
      <input class="modal__input" type="text" required name="login" id="login" placeholder="Введите логин">
      <label class="visually-hidden" for="password">Пароль</label>
      <input class="modal__input" type="password" required name="password" id="password" placeholder="Введите пароль">
      <label class="visually-hidden" for="confirm-password">Повтор пароля</label>
      <input class="modal__input" type="password" required name="confirm_password" id="confirm-password"
        placeholder="Повторите пароль">
      <button class="modal__reg-btn" type="submit">Зарегистрироваться</button>
    </form>
  </div>

  </div>
  <script type="module" src="homework-11.js"></script>

</body>

</html>
